baseURL = 'https://indiepass.app/'
languageCode = 'en-gb'
title = 'IndiePass'
theme = 'indiepass'

[params]
description = 'IndiePass, a social app for the IndieWeb'
favicon = 'favicon.svg'
logo = 'images/logo.svg'

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[module]
[[module.mounts]]
source = 'assets'
target = 'assets'

[caches]
[caches.images]
dir = ':cacheDir/images'