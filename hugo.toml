baseURL = 'https://indiepass.app/'
languageCode = 'en-gb'
title = 'IndiePass'
theme = 'indiepass'

ignoreLogs = ['warning-goldmark-raw-html']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'

[caches]
[caches.images]
dir = ':cacheDir/images'